name: Reusable Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
      helm-values-path:
        required: false
        type: string
        default: './todoapp/values.yaml'
      helm-release-name:
        required: false
        type: string
        default: 'todoapp'

jobs:
  deployment:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Download Helm package artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-package

      - name: Set Up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Deploy helm
        run: |
          helm upgrade --install --wait --timeout 500s --debug \
            ${{ inputs.helm-release-name }} ./todoapp-*.tgz \
            -f ${{ inputs.helm-values-path }}

      - name: Debug Kubernetes Pods on Failure
        if: failure()
        run: |
          echo "=== Kube Pods Status ==="
          kubectl get pods -A
          echo "=== Describe Pods in todoapp namespace ==="
          kubectl describe pods -n todoapp || true
          echo "=== Logs for TodoApp ==="
          kubectl logs -n todoapp -l app.kubernetes.io/name=todoapp --tail=100 || true
